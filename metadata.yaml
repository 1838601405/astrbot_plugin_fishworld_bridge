name: astrbot_plugin_fishworld_bridge
display_name: 鱼世界桥
short_desc: 把 AstrBot 的 QQ 能力借给 DSH 的鱼世界。
desc: |
  让 DSH（DeepSeek Harness）里的「鱼的世界」把 AstrBot 当作 QQ 通道，
  从而不必再单独安装 dsh-qq-bridge。

  ## 它做什么

  起一个只监听 127.0.0.1 的 HTTP 服务，把鱼世界发来的 OneBot 请求
  转给 AstrBot 的 aiocqhttp 适配器。用 `bot.call_action()` 转发，
  属于全量透传，所以群历史、合并转发、戳一戳、QQ 空间登录态都不会丢。

  也能让鱼借用 AstrBot 里已装插件的工具（搜索、翻译等）。

  ## 重要：鱼始终是同一条鱼

  借用工具时，本插件只负责**执行**并返回**原始结果**，
  不会用 AstrBot 的模型或人格生成回复。
  鱼的模型、人设、记忆、语气全部留在 DSH 那一侧。

  所以本插件只提供 `/tool`，不提供 `/agent`。

  ## 怎么用

  1. 装好本插件并重载。
  2. 在插件配置里拿到自动生成的 token（`fw_` 开头）。
  3. 在 DSH 的「鱼的世界 → AstrBot 接入」里填入地址
     `http://127.0.0.1:6210` 和这个 token，点「测试连通」。
  4. 确认连通后，打开「把 AstrBot 当作 QQ 通道」。

  ## 安全

  - 只监听 127.0.0.1，不对外网开放。
  - 每个请求都要 Bearer token，用常量时间比较。
  - 没有 token 时不启动服务，宁可不可用也不裸奔。
  - AstrBot 的登录态不离开它自己的进程。
